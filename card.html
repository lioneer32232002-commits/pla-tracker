var PB=D.pai,pbW=176,pbH=9,pgap=17,pby=245;
var wpl=tw_(PB.label,24,500,1.6),wps=tw_(String(PB.score),32,400,0,FD),
    wpb=tw_(PB.band,25,700,2);
var ptot=wpl+pgap+wps+pgap+pbW+pgap+wpb,psx=(W-ptot)/2;
txt(PB.label,psx,pby,24,CO.sub,500,'left',1.6);psx+=wpl+pgap;
txt(String(PB.score),psx,pby+3,32,PB.color,400,'left',0,FD);psx+=wps+pgap;
x.fillStyle='rgba(255,255,255,0.10)';rr(psx,pby-15,pbW,pbH,pbH/2);
x.fillStyle=PB.color;rr(psx,pby-15,Math.max(pbH,pbW*PB.score/100),pbH,pbH/2);
psx+=pbW+pgap;
txt(PB.band,psx,pby,25,PB.color,700,'left',2);

// ── 當日三數字（置中對稱：數字在上、標籤在下）────────────────────────────
// 當日活動空域不再另立一行——地圖上已有空域標籤，同一資訊寫兩次只是佔版面。
var cw=(W-2*P)/3;
var st=[[D.l_ac,String(D.ac),CO.y,D.s_ac],
        [D.l_ml,String(D.ml),CO.y,D.cr],
        [D.l_sh,String(D.sh),CO.r,D.s_sh]];
for(var i=0;i<3;i++){
  var ccx=P+cw*i+cw/2;
  // 數字用戰損字型：它只有一種字重，指定 900 會觸發瀏覽器合成粗體、把破損紋理糊掉，
  // 所以這裡固定 400，字距也回到 0（-2 是給原本黑體收緊用的）。
  txt(st[i][1],ccx,352,116,st[i][2],400,'center',0,FD);
  txt(st[i][0],ccx,396,26,CO.lbl,500,'center',1.8);
  if(st[i][3])txt(st[i][3],ccx,432,24,CO.sub,500,'center',1);
}

// ── 地圖（滿版出血）────────────────────────────────────────────────────────
// MTOP 452（原 436）：三個數字下移 16px 後讓出來的位置。MH 因此 816→800，
// 取景比例 K=MH/5.67*CS≈129 仍高於 MW/9.0=120 的下限，左緣不會露出 geo 裁切直邊。
// 再往下壓地圖就會逼近下限，要加東西請改動別處。
var MTOP=452,MBOT=1252,MH=MBOT-MTOP,MX=0,MW=W;
// 取景：先讓北部空域框頂(26.5)與西南空域框底(21.0)都進得來，再以 MW/9.0 設
// 經度視野下限——超過下限，左緣會露出 geo_card.json 被裁切出的直邊。
var LONC=120.32,LATC=23.78,CS=Math.cos(LATC*Math.PI/180);
var K=Math.max(MH/5.67*CS,MW/9.0),KY=K/CS;
var LON0=LONC-MW/2/K,LATT=LATC+MH/2/KY;
function pX(lo){return MX+(lo-LON0)*K;}
function pY(la){return MTOP+(LATT-la)*KY;}

x.save();
x.beginPath();x.rect(MX,MTOP,MW,MH);x.clip();
x.fillStyle=CO.sea;x.fillRect(MX,MTOP,MW,MH);

function ringPath(rings){x.beginPath();
  for(var a=0;a<rings.length;a++){var r=rings[a];
    for(var b=0;b<r.length;b++){var qx=pX(r[b][0]),qy=pY(r[b][1]);
      if(b)x.lineTo(qx,qy);else x.moveTo(qx,qy);}
    x.closePath();}}

ringPath(D.geo.cn);x.fillStyle=CO.land;x.fill();

// 12 浬領海：沿本島外緣由粗到細疊四層綠，做出向外淡出的漸層帶
// （與首頁 _MAP_JS 的 gradZone12 同一種分層做法，只是改用等距外擴的描邊）
var bw=[0.40,0.30,0.21,0.12],ba=[0.04,0.07,0.11,0.16];
ringPath([D.geo.tw[0]]);x.lineJoin='round';
for(var bi=0;bi<bw.length;bi++){
  x.lineWidth=bw[bi]*KY;x.strokeStyle='rgba(77,186,106,'+ba[bi]+')';x.stroke();}
// 離島 12 浬光暈（澎湖／綠島／蘭嶼），同 _MAP_JS 的 gradCircle 分層
function gradCircle(la,lo,km){
  var sc=[1.0,0.72,0.47,0.25],fo=[0.06,0.11,0.17,0.25],rp=km/111.0*KY;
  for(var i=sc.length-1;i>=0;i--){
    x.beginPath();x.arc(pX(lo),pY(la),rp*sc[i],0,6.2832);
    x.fillStyle='rgba(77,186,106,'+fo[i]+')';x.fill();}}
gradCircle(23.57,119.62,38);gradCircle(22.67,121.47,22.2);gradCircle(22.05,121.55,22.2);

ringPath(D.geo.tw);x.fillStyle=CO.tw;x.fill();
x.strokeStyle='rgba(150,172,188,0.30)';x.lineWidth=1.2;x.stroke();

// 活動空域：照首頁 gradZone 的做法——以焦點為中心逐層縮小疊加同色低透明度，
// 疊出中心濃、邊緣淡的漸層（不是單一色塊，也不描邊框）。
var ZP={n:[[[25.5,120.3],[26.5,120.3],[26.5,122.5],[25.5,122.0]],[25.6,121.2],[26.16,120.72]],
        c:[[[25.05,119.75],[25.05,120.45],[23.6,120.05],[23.6,118.95]],[24.3,119.8],[24.88,119.98]],
        sw:[[[23.0,117.0],[23.0,119.8],[21.0,121.0],[21.0,117.0]],[22.2,119.5],[21.72,117.35]],
        s:[[[21.9,120.05],[21.9,121.9],[21.0,121.9],[21.0,120.05]],[21.45,121.0],[21.72,121.45]],
        e:[[[22.0,122.0],[24.5,122.0],[24.5,123.5],[22.0,123.5]],[23.0,122.1],[24.28,122.15]],
        ne:[[[26.5,120.7],[26.5,122.2],[25.4,121.8],[25.4,121.0]],[25.5,121.2],[25.62,121.42]]};
// 等高線式疊加：與首頁 _MAP_JS 的 gradZone 用同一組縮放係數與透明度，
// 一層層看得見邊界（使用者 2026-07-31 指定要跟網頁一致）。
// 不要描邊、也不要整塊上模糊——前者「有框線很怪」，後者會糊成沒有形狀的光斑。
var ZSC=[1.0,0.78,0.58,0.40,0.24],ZFO=[0.04,0.07,0.10,0.14,0.19];
var zl=[];
function zonePath(co,fp,sc){x.beginPath();
  for(var j=0;j<co.length;j++){
    var la=fp[0]+sc*(co[j][0]-fp[0]),lo=fp[1]+sc*(co[j][1]-fp[1]);
    var zx=pX(lo),zy2=pY(la);if(j)x.lineTo(zx,zy2);else x.moveTo(zx,zy2);}
  x.closePath();}
for(var zk in ZP){
  if(!D.zones[zk])continue;
  var Z=ZP[zk],co=Z[0],fp=Z[1],lp=Z[2];
  for(var si=ZSC.length-1;si>=0;si--){
    zonePath(co,fp,ZSC[si]);x.fillStyle='rgba(245,200,66,'+ZFO[si]+')';x.fill();}
  zl.push([D.zn[zk],pX(lp[1]),pY(lp[0])]);
}

// 海峽中線（首末各外推一段，讓線貫穿整個畫面而不是斷在半空）
var MLPT=[[27.3,120.82],[26.5,120.5],[26.0,120.3],[25.5,120.0],[25.0,119.8],[24.5,119.5],
          [24.0,119.2],[23.5,119.1],[23.0,119.0],[22.5,118.9],[20.4,118.48]];
x.beginPath();
for(var mi=0;mi<MLPT.length;mi++){var mx=pX(MLPT[mi][1]),my=pY(MLPT[mi][0]);
  if(mi)x.lineTo(mx,my);else x.moveTo(mx,my);}
x.setLineDash(D.ml>0?[16,11]:[11,10]);
x.strokeStyle=D.ml>0?'rgba(224,87,92,0.92)':'rgba(120,150,165,0.55)';
x.lineWidth=D.ml>0?3.5:2.4;x.stroke();x.setLineDash([]);

// 地名與空域名稱
x.shadowColor='rgba(0,0,0,0.85)';x.shadowBlur=12;
txt(D.lbl.tw,pX(120.96),pY(24.28),32,'#f2f7fa',700,'left',3);
txt(D.lbl.ph,pX(119.24),pY(23.36),20,'#a9b7c0',500,'left',1);
txt(D.lbl.km,pX(118.06),pY(24.34),20,'#a9b7c0',500,'left',1);
txt(D.lbl.mz,pX(119.62),pY(26.02),20,'#a9b7c0',500,'left',1);
for(var zi=0;zi<zl.length;zi++){txt(zl[zi][0],zl[zi][1],zl[zi][2],26,CO.y,700,'left',1.5);}
x.shadowBlur=0;

// 上下淡出，讓地圖融進版面而不是關在框裡
var gt=x.createLinearGradient(0,MTOP,0,MTOP+80);
gt.addColorStop(0,CO.bg);gt.addColorStop(1,'rgba(13,17,20,0)');
x.fillStyle=gt;x.fillRect(MX,MTOP,MW,80);
var gb=x.createLinearGradient(0,MBOT-150,0,MBOT);
gb.addColorStop(0,'rgba(13,17,20,0)');gb.addColorStop(1,CO.bg);
x.fillStyle=gb;x.fillRect(MX,MBOT-150,MW,150);
x.restore();

// ── 圖例：橫排置中貼地圖底緣（畫在淡出之後，才不會被洗淡）─────────────────
var ly=MBOT-26,lc='rgba(220,229,236,0.85)';
var w1=tw_(D.leg.ml,23,500,1),w2=tw_(D.leg.nm,23,500,1),w3=D.hasZone?tw_(D.leg.zone,23,500,1):0;
var tot=(60+w1)+46+(60+w2)+(D.hasZone?46+60+w3:0);
var lx=(W-tot)/2;
x.setLineDash([9,7]);x.strokeStyle=D.ml>0?'rgba(224,87,92,0.92)':'rgba(120,150,165,0.55)';
x.lineWidth=3.5;x.beginPath();x.moveTo(lx,ly-8);x.lineTo(lx+46,ly-8);x.stroke();x.setLineDash([]);
txt(D.leg.ml,lx+60,ly,23,lc,500,'left',1);
lx+=60+w1+46;
x.fillStyle='rgba(77,186,106,0.32)';x.fillRect(lx,ly-17,46,13);
txt(D.leg.nm,lx+60,ly,23,lc,500,'left',1);
if(D.hasZone){lx+=60+w2+46;
  x.fillStyle='rgba(245,200,66,0.34)';x.fillRect(lx,ly-17,46,13);
  txt(D.leg.zone,lx+60,ly,23,lc,500,'left',1);}

// ── 頁尾：月累計（標籤灰、數字白粗）＋一行置中落款 ────────────────────────
// 三行置中堆疊，字級比照使用者 Canva 母版（36／42／33，全部粗體）。
// 「資料來源／國防部」與網址之間刻意拉開並夾一條分隔線——兩行貼太近會被誤讀成
// 「國防部的網址是這個」（使用者 2026-08-05 指正）。
var mtxt='';for(var mi2=0;mi2<D.moseg.length;mi2++)mtxt+=D.moseg[mi2][0];
txt(mtxt,W/2,1312,36,CO.lbl,700,'center',0.5);
txt(D.src,W/2,1404,42,CO.dim,700,'center',1);
// 原本是 92px 寬、2px 粗的深色短線，在 #0d1114 上幾乎看不見，讀起來像中間空了一大行
//（使用者 2026-08-13 回報）。改成 420px 寬的 1px 細線：筆觸更輕、但長度撐得起
// 上下兩行的寬度，才看得出是一條刻意的分隔線而不是空白。
// y 用 .5：canvas 的 1px 線畫在整數座標會跨兩列做反鋸齒，顏色被攤掉一半、看起來糊，
// 半像素才會落成一條實心的髮絲線。
line(W/2-210,1452.5,W/2+210,1452.5,'#2a343b',1);
txt(D.site,W/2,1520,33,CO.sub,700,'center',1.5);
// 地圖免責標示改留在地圖內右下角（公告只給空域名稱、沒有邊界，框是推定的示意範圍）
txt(D.mapnote,W-P,MBOT-14,19,CO.dim,400,'right',1);

}

paint();
// canvas 用到的網頁字型**不會**被瀏覽器自動下載——字型是依 DOM 的使用情況才載，
// 而這支字型只出現在 canvas 裡。所以要用 fonts.load() 明確觸發下載，載完重畫一次。
// paint() 開頭就重填背景，重畫是安全的（不會疊字）。
if(document.fonts&&document.fonts.load){
  document.fonts.load('400 116px "Black Ops One"').then(paint).catch(function(){});
}

// ── 下載 ──────────────────────────────────────────────────────────────────
var btn=document.getElementById('carddl');
if(btn)btn.addEventListener('click',function(){
  try{
    C.toBlob(function(b){
      if(!b)return;
      var u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download='pla-tracker-'+D.date+'.png';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u);},8000);
    },'image/png');
  }catch(e){
    var st2=document.getElementById('cardmsg');
    if(st2)st2.textContent='\u700f\u89bd\u5668\u4e0d\u652f\u63f4\u81ea\u52d5\u4e0b\u8f09\uff0c\u8acb\u9577\u6309\u5716\u7247\u5132\u5b58\u3002';
  }
});
})(); }
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(draw).catch(draw);}
  else{draw();}
})();
</script>
