name: Daily PLA Tracker Update

on:
  schedule:
    # 台灣時間 12:00 = UTC 04:00
    - cron: '0 4 * * *'
    # 台灣時間 14:00 = UTC 06:00 (備用，若12點MND尚未更新)
    - cron: '0 6 * * *'
  workflow_dispatch:  # 允許手動觸發
    inputs:
      force_rebuild:
        description: '強制重建網站（即使今日數據已存在）'
        required: false
        default: 'false'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch and update
        id: fetch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
        run: python scripts/fetch_and_update.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "pla-tracker-bot"
          git config user.email "bot@pla-tracker"
          git add data/records.csv index.html records.html style.css favicon.svg version.txt
          git diff --cached --quiet && echo "changed=false" >> $GITHUB_OUTPUT && exit 0
          git commit -m "auto: daily update $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      # 只有「確實新增當日資料」時才寄報告信，備援班次（資料已存在）不會重複寄送。
      - name: Send daily email report
        if: steps.fetch.outputs.outcome == 'new'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/send_daily_email.py

      # 更新失敗時寄通知信並說明原因：
      #   - source_error：找到公告但國防部圖片伺服器下載失敗（腳本優雅結束，exit 0）
      #   - failure()：爬蟲或解讀發生未預期例外（exit 1）
      # 「公告尚未發布」屬正常情況，不在此通知範圍。
      - name: Send failure notification
        if: ${{ failure() || steps.fetch.outputs.outcome == 'source_error' }}
        env:
          EMAIL_MODE: failure
          FAILURE_REASON: ${{ steps.fetch.outputs.error_detail || '爬蟲執行發生未預期錯誤，請查看執行紀錄' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/send_daily_email.py
