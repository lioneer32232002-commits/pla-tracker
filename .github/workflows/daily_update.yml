name: Daily PLA Tracker Update

on:
  schedule:
    # 分鐘一律用 :17 而不是 :00——GitHub 的排程是盡力而為、整點最壅塞。
    # 2026-08-09 實測（12 天 36 班）：整點班平均延遲 121 分鐘，沒有一班在 10 分鐘內發車。
    # 改 cron 時間務必同步改下面的 IS_FINAL_CHECK（它比對的是 cron 字串本身）。
    # 台灣時間 12:17 ≒ UTC 04:17
    - cron: '17 4 * * *'
    # 台灣時間 14:17 ≒ UTC 06:17 (備用，若12點MND尚未更新)
    - cron: '17 6 * * *'
    # 台灣時間 20:17 ≒ UTC 12:17 (晚間最終檢查：仍無當日資料才寄一次提醒)
    - cron: '17 12 * * *'
  workflow_dispatch:  # 允許手動觸發
    inputs:
      force_rebuild:
        description: '強制重建網站（即使今日數據已存在）'
        required: false
        default: 'false'
      final_check:
        description: '視為晚間最終檢查（若今日仍無資料則寄提醒信）'
        required: false
        default: 'false'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # 是否為「晚間最終檢查」班次：只有這一班會在今日無資料時寄提醒，
      # 確保失敗/未發布提醒一天最多一封。
      IS_FINAL_CHECK: ${{ github.event.schedule == '17 12 * * *' || github.event.inputs.final_check == 'true' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch and update
        id: fetch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
        run: python scripts/fetch_and_update.py

      # 驗證關卡：build 後、commit 前。任何 CSV/HTML/SEO/sitemap 問題都會中止本班，
      # 不讓壞掉的輸出被自動 commit/push（落實 CLAUDE.md「驗證未過不得 commit」）。
      - name: Validate build output
        run: python -X utf8 scripts/validate.py all

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "pla-tracker-bot"
          git config user.email "bot@pla-tracker"
          git add data/records.csv data/arsenal.csv data/arsenal_peers.csv index.html records.html monthly.html about.html card.html arsenal/ style.css favicon.svg version.txt sitemap.xml robots.txt og.png og-en.png en/
          git diff --cached --quiet && echo "changed=false" >> $GITHUB_OUTPUT && exit 0
          git commit -m "auto: daily update $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      # 只有「確實新增當日資料」時才寄報告信，備援班次（資料已存在）不會重複寄送。
      - name: Send daily email report
        if: steps.fetch.outputs.outcome == 'new'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/send_daily_email.py

      # 晚間最終檢查（台灣 20:00）：若今日仍無資料才寄「一封」提醒信，說明原因。
      # 涵蓋兩種情況，並一天最多一封（只有 IS_FINAL_CHECK 班次會寄）：
      #   - source_error / error / failure()：抓取或解讀失敗
      #   - unpublished：國防部整天未發布共機動態公告
      # 白天 12:00 / 14:00 班次失敗時保持安靜（屬重試），不寄信。
      # 若 20:00 前資料已補上（outcome=new/exists）則不寄。
      - name: Send end-of-day alert (data still missing)
        if: ${{ env.IS_FINAL_CHECK == 'true' && (failure() || steps.fetch.outputs.outcome == 'source_error' || steps.fetch.outputs.outcome == 'unpublished' || steps.fetch.outputs.outcome == 'error') }}
        env:
          EMAIL_MODE: failure
          FAILURE_REASON: ${{ steps.fetch.outputs.error_detail || (steps.fetch.outputs.outcome == 'unpublished' && '國防部今日（截至晚間）尚未發布共機動態公告') || '爬蟲執行發生未預期錯誤，請查看執行紀錄' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/send_daily_email.py
